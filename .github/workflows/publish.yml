name: Publish

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    environment: maven
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Verify version is NOT SNAPSHOT
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          echo "gradle.properties version: ${version}"
          if [[ "${version}" == *-SNAPSHOT ]]; then
            echo "::error::Release workflow refusing to run — version '${version}' is still a SNAPSHOT. Bump to release version before tagging."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: gradle/actions/wrapper-validation@v4

      - name: Run tests
        run: ./gradlew check

      - name: Publish to Maven Central
        run: ./gradlew publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

      - name: Trigger Central Portal deployment
        run: |
          TOKEN=$(echo -n "${{ secrets.SONATYPE_USERNAME }}:${{ secrets.SONATYPE_PASSWORD }}" | base64)
          curl -s -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/io.github.harryjhin?publishing_type=automatic"

      - name: Create GitHub Release
        run: gh release create ${{ github.ref_name }} --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
