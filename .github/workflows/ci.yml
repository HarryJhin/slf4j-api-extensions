name: CI

on:
  push:
    branches: [v1]
    paths-ignore:
      - 'docs/**'
      - '*.md'
    tags-ignore:
      - 'v*'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17']
        kotlinVersion: ['1.9.25']
    name: Build (Java ${{ matrix.java }}, Kotlin ${{ matrix.kotlinVersion }})
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: gradle

      - uses: gradle/actions/wrapper-validation@v4

      - name: Build & Test
        run: ./gradlew build -PkotlinVersion=${{ matrix.kotlinVersion }}

      - name: Sample integration test
        run: cd sample && ../gradlew compileKotlin

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java${{ matrix.java }}-kotlin${{ matrix.kotlinVersion }}
          path: '**/build/reports/tests/'

      - name: Cleanup Gradle Cache
        run: |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties
